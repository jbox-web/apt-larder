---
name: Release Binaries

# No job gets more than it needs: the builds only read the repository, and the
# single job that publishes is the only one holding a token that can write.
permissions: {}

# crystalline is the Crystal LSP server, only needed in an editor — see the
# same block in ci.yml for why it must be disabled on the runners.
env:
  MISE_DISABLE_TOOLS: aqua:elbywan/crystalline

on:
  push:
    tags:
      - '*'

jobs:
  # A tag can be pushed on any commit: the suite runs here too, so a release is
  # never built from a commit the tests reject.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

  build_linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Build static binaries
        run: mise release:static

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux
          path: |
            packages/apt-larder-linux-amd64
            packages/apt-larder-linux-amd64.sha256
            packages/apt-larder-linux-arm64
            packages/apt-larder-linux-arm64.sha256
          if-no-files-found: error

  build_macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install bdw-gc
        run: brew install bdw-gc

      - name: Setup mise
        uses: jdx/mise-action@v5

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise release:deps

      - name: Build binary
        run: mise release:build
        env:
          OUTPUT_FILE: bin/apt-larder-darwin-${{ matrix.arch }}

      # Only the binary and its checksum: the build also leaves a .dwarf debug
      # file next to it, which is not a release asset.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binaries-darwin-${{ matrix.arch }}
          path: |
            bin/apt-larder-darwin-${{ matrix.arch }}
            bin/apt-larder-darwin-${{ matrix.arch }}.sha256
          if-no-files-found: error

  # One job creates the release, once every platform has built: three jobs
  # each creating it would race, and a platform that fails to build must fail
  # the release instead of leaving it short of that platform.
  publish:
    needs: [build_linux, build_macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Create release and publish assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
